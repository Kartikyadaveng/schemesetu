<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary Meta -->
    <title>SchemeSetu — AI-Powered Indian Government Scheme Finder</title>
    <meta name="description" content="Find government schemes, scholarships, and welfare programs you qualify for — powered by AI. SchemeSetu is your guide to 1200+ Indian government schemes." />
    <meta name="keywords" content="government schemes India, PM schemes, scholarship, farmer schemes, women schemes, Ayushman Bharat, PM Kisan, SchemeSetu" />
    <meta name="author" content="SchemeSetu" />
    <meta name="theme-color" content="#FF6B35" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SchemeSetu — Find Government Schemes You Qualify For" />
    <meta property="og:description" content="AI-powered app to discover Indian Government schemes, scholarships, and welfare programs." />
    <meta property="og:image" content="/images/logo.png" />

    <!-- PWA Manifest -->
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SchemeSetu" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent FOUC */
      html, body {
        margin: 0;
        padding: 0;
        background: #F8F9FF;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html.dark, html.dark body {
        background: #0D1117;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
